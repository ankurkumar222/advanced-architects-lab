const S=[

{sec:"intro",c:"ink",eyebrow:"SQL Database Internals",t:"a",h:"SQL Database Internals — <em>Correctness, Under the Hood</em>",body:`
<p>A SQL database isn't a black box that magically answers queries — it's a stack of deliberate trade-offs: how bytes sit on disk, how a B+ tree stays balanced under write pressure, how concurrency is allowed without corruption, and how a crash mid-write still recovers to a truthful state. Plus a real deployment section and a leadership decision-making section.</p>
<div class="note"><b>How to use:</b> "?" slides ask you to think first, out loud, before revealing. Recall quizzes close each section. Goal: reasoning, not recall.</div>`},

/* ---------- MENTAL MODEL + STORAGE ---------- */
{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"q",q:`What is the <b>deepest structural difference</b> between a SQL database and a key-value store — not the syntax, the actual engineering consequence?`},

{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"a",h:"What a SQL DB is actually promising you",body:`
<div class="ascii">App --> SELECT / INSERT / UPDATE / DELETE
Underneath:
Parser -> Optimizer -> Execution Engine -> Storage Engine
                                             (tables, indexes,
                                              WAL, buffer pool)
The whole discipline exists to answer one question: how do
relations, indexes, and transactions stay correct and fast at
the same time, on disk, under concurrency, after a crash?</div>
<div class="note">A key-value store optimizes around a single access pattern: get/put by key. A SQL DB commits to something harder — <b>arbitrary relational access</b> (joins, ranges, aggregates, ad-hoc predicates) decided at query time, not schema-design time. That single commitment is why it needs an optimizer, a cost model, and multiple index strategies — a KV store never has to "decide how" to answer a query, because there's only one way to ask.</div>`},

{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"q",q:`If SQL is declarative — you say <b>what</b>, not <b>how</b> — where does the risk in that trade-off actually show up in production?`},

{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"a",h:"The declarative risk moves, it doesn't disappear",body:`
<p>The risk moves from "did I write the loop correctly" to <strong>"did the optimizer choose the plan I assumed it would."</strong> A query that's correct and fast for months can silently flip to a disastrous plan the moment table statistics drift, a new index appears, or row counts cross a planner threshold — with the SQL text never changing at all.</p>`},

{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"q",q:`Constraints (foreign key, unique, not null, check) — are these a convenience feature, or do they change what the database is <b>fundamentally responsible for</b>?`},

{sec:"mental",c:"teal",eyebrow:"00 · Mental Model",t:"a",h:"Constraints change the contract",body:`
<p>They change the contract. Without them, the database is a passive store and <strong>correctness is entirely the application's job</strong>. With them, the database becomes an active participant that refuses to persist a state that violates a declared invariant — meaning constraint design is really a decision about <b>where in the stack correctness is enforced</b>, not just a schema nicety.</p>
<div class="note">Why can two teams run the exact same schema and query patterns and get wildly different production behavior? Because everything below the schema — page layout, index choice, isolation level, buffer pool sizing, WAL configuration — is a separate set of decisions the schema doesn't dictate. Two identical schemas under different storage and concurrency configurations are, for all practical performance and correctness purposes, <b>different systems</b>.</div>`,
cto:[`The contract a system makes is more important than the implementation behind it. When engineers debate SQL vs. NoSQL, they are rarely debating technology — they are debating which guarantees they are willing to own. The choice of abstraction is the choice of accountability.`]},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"q",q:`Why does the database bother with <b>fixed-size pages</b> at all instead of just reading and writing rows directly?`},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"a",h:"Pages, not rows — why layout is a first-class decision",body:`
<div class="ascii">Disk
 +--> Page 101: [row][row][row]
 +--> Page 102: [row][row][row]

Heap-style              Clustered / index-organized
rows wherever free      rows physically ordered
space exists            by primary/cluster key
Page 1: row A, row F    Page 1: key 1,2,3
Page 2: row B, row Z    Page 2: key 4,5,6</div>
<div class="note">Because disk and OS I/O is fundamentally <b>block-oriented</b> — a fixed page size lets the database align its unit of I/O, caching, and locking with the unit the hardware and filesystem actually move efficiently. Row-by-row I/O would mean constant tiny reads/writes with no way to amortize disk-seek cost or reason about cache residency.</div>`},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"q",q:`A heap table lets inserts go wherever there's free space. What does that <b>flexibility cost you later</b>?`},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"a",h:"Heap tables trade write-time simplicity for read-time scatter",body:`
<p>It costs you <strong>locality</strong>. Rows that are logically related (e.g. all orders for one customer) can end up scattered across unrelated pages, so a query that "should" be one sequential read becomes several random reads.</p>`},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"q",q:`If a table is clustered on its primary key, what happens to insert performance when the primary key isn't monotonically increasing (e.g. a random UUID)?`},

{sec:"mental",c:"teal",eyebrow:"01 · Storage",t:"a",h:"Random keys and page splits",body:`
<p>Inserts start landing at <strong>random points</strong> in the physical ordering instead of always appending at the end — this causes page splits, fragmentation, and write amplification. This is exactly why many high-throughput clustered systems prefer monotonic or time-ordered keys (or a separate surrogate key) over raw random UUIDs as the clustering key.</p>
<div class="note">Is choosing heap vs. clustered organization a one-time schema decision, or does it need revisiting as access patterns evolve? It needs <b>revisiting</b>. A table designed for point lookups by a surrogate key may later be dominated by range scans on a different column — at that point the clustering choice that was correct at design time actively works against the dominant query pattern, and re-clustering becomes a real migration decision, not a tweak.</div>`,
cto:[`The choices closest to the metal compound upward through every abstraction above them. A schema design meeting that ignores page layout is optimizing at the wrong altitude — what looks like a row to the application is always a page-shaped problem to the storage engine. Leaders who skip the physical layer do not eliminate it; they just lose their ability to reason about it.`]},

{sec:"mental",c:"teal",eyebrow:"Mental Model &amp; Storage · Recall",t:"r",h:"Quick recall: mental model and storage",qs:[
{q:`What's the deepest engineering consequence of SQL's commitment to arbitrary relational access?`,a:`It needs an optimizer, a cost model, and multiple index strategies — a KV store never has to "decide how" to answer a query because there's only one way to ask; SQL must decide at query time.`},
{q:`Why do fixed-size pages exist at all?`,a:`Disk/OS I/O is block-oriented — pages align the database's unit of I/O, caching, and locking with what hardware actually moves efficiently.`},
{q:`Why does a random UUID clustering key hurt insert performance?`,a:`Inserts land at random points in the physical ordering instead of appending at the end, causing page splits, fragmentation, and write amplification.`}]},

/* ---------- INDEXES + OPTIMIZER ---------- */
{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"q",q:`Why is a B+ tree preferred over a plain binary search tree for database indexes specifically?`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"a",h:"The real heart of a SQL database",body:`
<div class="ascii">[50]
   /      \\
[20]        [80]
Leaf nodes point to row locations or actual row data

Composite index (customer_id, created_at):
customer=1001, time=2026-04-01
customer=1001, time=2026-04-02
customer=1002, time=2026-04-01

Covering index (department, name, salary):
query can be answered from the index alone -
no trip back to the table needed</div>
<div class="note">Because the cost that matters is <b>disk page reads</b>, not comparisons. A B+ tree's high fan-out keeps the tree shallow (few page reads per lookup) and its leaf-level linked structure makes <b>range scans</b> — the dominant real-world query shape — sequential and cheap, neither of which a binary tree gives you on block-oriented storage.</div>`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"q",q:`A query filters on <code>customer_id</code> and sorts by <code>created_at</code>. Why does column <b>order</b> inside the composite index matter so much — wouldn't any index containing both columns work?`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"a",h:"Order defines what the index can do for free",body:`
<p>No — order defines what the index can do for free. An index on <code>(customer_id, created_at)</code> lets the engine seek directly to a customer and walk already-sorted rows. The reverse order, <code>(created_at, customer_id)</code>, forces a scan across all customers at each timestamp — same two columns, opposite usefulness, because a B+ tree is only ordered by its leading columns.</p>`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"q",q:`If a covering index avoids a trip back to the table, why doesn't every team just make <b>every</b> index cover every commonly-needed column?`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"a",h:"Every extra column is write amplification",body:`
<p>Because every extra column in an index is <strong>write amplification</strong> — every insert/update/delete on the table now also has to maintain that wider index. Covering indexes trade faster reads for slower writes and more storage, so they're a targeted decision for genuinely hot query shapes, not a default to apply everywhere.</p>`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"q",q:`Can adding an index ever make a specific query <b>slower</b>, not faster?`},

{sec:"idx",c:"gold",eyebrow:"02 · Indexes",t:"a",h:"Yes — index count isn't purely additive",body:`
<p>Yes. If the optimizer's cost estimate is wrong (stale statistics, skewed data), it can choose an index scan with expensive random-row lookups over a cheap sequential table scan, especially when the query would return a large fraction of the table anyway. More indexes also means more choices for the optimizer to get wrong.</p>`,
cto:[`Every index is a bet on the future — a tax on every write, paid forever, in exchange for a read you hope will dominate. The discipline of index design is knowing which questions will matter before you know that they matter. When I hear a team say "we'll just add an index," I ask: at what write cost, for which query shape, decided by whom — because an index nobody owns eventually owns your write throughput.`]},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"q",q:`Nested loop, hash join, and merge join all produce the same result set. Why does the optimizer need to choose carefully rather than just always picking one?`},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"a",h:"The part that decides what &quot;your query&quot; actually costs",body:`
<div class="ascii">SQL text -> Parser -> Logical plan -> Optimizer -> Physical plan -> Execution
Customers JOIN Orders - possible plans:
A) scan customers -> probe orders index      (nested loop)
B) scan orders -> hash join customers        (hash join)
C) sort both -> merge join                   (merge join)
Optimizer picks based on estimated cost, not on which plan a
human would find most "obviously correct."</div>
<div class="note">Their cost curves differ wildly with data shape. <b>Nested loop</b> wins when one side is tiny and indexed. <b>Hash join</b> wins for large, unsorted, roughly equal-sized sets. <b>Merge join</b> wins when both sides are already sorted. Hard-coding one choice would make some common query shapes catastrophically slow.</div>`},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"q",q:`The optimizer's plan choice depends on cost estimates. Where do those estimates actually <b>come from</b>, and what happens when they're wrong?`},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"a",h:"Statistics: collected periodically, not computed live",body:`
<p>They come from <strong>table statistics</strong> — row counts, value distributions, histograms — collected periodically, not computed live. When data changes faster than statistics refresh (a bulk load, a sudden skew), the optimizer reasons about a world that no longer exists and can pick a plan that's disastrously wrong for current reality, even though the SQL never changed.</p>
<div class="note">Is a query plan that was optimal yesterday guaranteed to still be optimal today with the same SQL and schema? No. Row counts grow, value distributions shift — a plan chosen at 10,000 rows can be actively wrong at 10 million. <b>Plans are a function of data state, not just SQL text.</b></div>`},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"q",q:`If declarative SQL hides the execution plan by design, how does a team stay confident that performance won't <b>silently regress</b>?`},

{sec:"idx",c:"gold",eyebrow:"03 · Optimizer",t:"a",h:"Treat plan visibility as a first-class operational concern",body:`
<p>By regularly inspecting <code>EXPLAIN</code> output for hot queries, alerting on plan changes for critical paths, and keeping statistics fresh — rather than trusting that "the SQL hasn't changed" means "the performance hasn't changed."</p>`,
cto:[`You do not control execution — you influence the conditions under which a decision is made. The optimizer is a reminder that senior engineers set constraints and then let go. The dangerous engineer assumes they know the outcome because they wrote the query. The dangerous leader assumes they know the outcome because they approved the plan. Build systems — and teams — that produce good decisions even when you are not in the room.`]},

{sec:"idx",c:"gold",eyebrow:"Indexes &amp; Optimizer · Recall",t:"r",h:"Quick recall: indexes and the optimizer",qs:[
{q:`Why does column order in a composite index matter, even though both orders "contain" the same columns?`,a:`A B+ tree is sorted only by its leading columns — <code>(customer_id, created_at)</code> lets you seek to a customer and walk sorted rows; the reverse order forces a scan across all customers per timestamp.`},
{q:`Where do the optimizer's cost estimates come from, and what breaks them?`,a:`Table statistics (row counts, distributions, histograms) collected periodically, not live. A bulk load or sudden skew makes the optimizer reason about a world that no longer exists.`},
{q:`Can adding an index make a query slower?`,a:`Yes — if statistics are stale or data is skewed, the optimizer can choose an expensive index scan over a cheap sequential scan, especially when the query returns a large fraction of the table.`}]},

/* ---------- ACID + CONCURRENCY ---------- */
{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"q",q:`Of the four ACID letters, which one is actually the database's <b>sole responsibility</b>, and which one quietly depends on the application getting something right?`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"a",h:"Each guarantee is bought with a specific mechanism",body:`
<div class="ascii">BEGIN
  debit A
  credit B
COMMIT  -- or ROLLBACK on failure
A = Atomicity   -> WAL + rollback segments
C = Consistency -> constraints + application invariants
I = Isolation   -> locking / MVCC
D = Durability  -> WAL fsync before acknowledging commit</div>
<div class="note">Atomicity, Isolation, and Durability are <b>entirely the database's job</b> — the app doesn't have to do anything special to get them. <b>Consistency</b> is different: the database only enforces the invariants you explicitly declared (constraints); any business invariant you didn't declare is still the application's responsibility, and ACID gives no guarantee about it.</div>`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"q",q:`Why does Durability specifically require an <b>fsync before acknowledging commit</b>, and what happens if that step is skipped for performance?`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"a",h:"Skipping fsync trades a real guarantee for throughput",body:`
<p>Without a forced flush to durable storage, the "committed" write may still be sitting in an <strong>OS page cache</strong> that a power loss or crash wipes out — the application believes the transaction is safely committed while the durable record of it never actually existed. That trade must be deliberate and disclosed, not an accident.</p>`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"q",q:`Can a transaction be atomic and durable, yet still produce a result the business considers <b>&quot;wrong&quot;</b>?`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"a",h:"ACID protects the mechanics, not the business rule",body:`
<p>Yes. ACID guarantees the transaction executed exactly once, fully, and survives a crash — it says nothing about whether the transaction's <em>logic</em> was correct. A transaction that debits the wrong account atomically and durably is still atomic and durable; ACID protects the mechanics, not the rule.</p>`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"q",q:`Why do long-running transactions tend to be dangerous even when each individual statement inside them is <b>fast</b>?`},

{sec:"tx",c:"violet",eyebrow:"04 · ACID",t:"a",h:"The danger is duration, not per-statement cost",body:`
<p>Because a transaction holds its <strong>locks (or MVCC version pressure) for its entire lifetime</strong>, not just per-statement. A transaction that's fast per-statement but left open (waiting on an external API call, for instance) blocks other transactions and prevents old row versions from being cleaned up.</p>`,
cto:[`ACID does not make your business logic correct — it makes your mechanics reliable. The gap between "the transaction committed" and "the right thing happened" is entirely owned by the people who designed the application. Whenever I review an incident, I separate two questions: did the database do what it promised, and did we ask it for the right promise? Most correctness bugs live in the second question, not the first.`]},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"q",q:`What specific problem does MVCC solve that pure locking cannot solve well?`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"a",h:"Locking vs. MVCC, and why most engines use both",body:`
<div class="ascii">Locking                          MVCC
Tx1 locks row R                  row has versions
Tx2 waits                        Tx1 sees old version
                                  Tx2 sees new version after commit
Readers block writers            Readers don't block writers
Writers block writers            Writers still need to coordinate</div>
<div class="note">It solves <b>readers blocking writers and writers blocking readers.</b> Under pure locking, a long read can stall writes and vice versa. MVCC gives every reader a consistent snapshot of old versions while writers create new versions — reads and writes stop contending for the same lock, which is why almost every high-throughput OLTP engine leans on MVCC.</div>`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"q",q:`If MVCC means readers never block, does that mean MVCC <b>eliminates the need for locks entirely</b>?`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"a",h:"MVCC + locks isn't a hedge, it's the actual architecture",body:`
<p>No. Two concurrent writers to the <strong>same row</strong> still need to coordinate — MVCC solves reader/writer conflict, not writer/writer conflict. "Modern SQL systems use MVCC + locks where needed" isn't a hedge: MVCC for reads, some form of locking or version-check for concurrent writes to the same row.</p>`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"q",q:`MVCC keeps old row versions around so readers can see a consistent snapshot. What <b>operational problem</b> does that create if left unmanaged?`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"a",h:"Bloat",body:`
<p>Old versions that no transaction can see anymore still occupy space until a cleanup process (vacuum, garbage collection) reclaims them — and a single long-running transaction can hold a snapshot open indefinitely, preventing cleanup and causing table and index bloat that degrades every subsequent query, silently, until someone investigates.</p>`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"q",q:`A deadlock occurs when Tx1 waits on a lock Tx2 holds, and Tx2 waits on a lock Tx1 holds. Is this a <b>bug</b>, or an expected outcome of correct locking behavior?`},

{sec:"tx",c:"violet",eyebrow:"05 · Concurrency",t:"a",h:"Detection and forced rollback, not prevention",body:`
<p>It's an <strong>expected outcome</strong>, not a bug — any system with fine-grained locking and no fixed lock-acquisition order can produce this cycle. The database's only correct response is detection and forced rollback of one participant; the real fix belongs in application design (consistent lock-acquisition ordering).</p>`,
cto:[`Concurrency solutions are, at their root, agreements about ordering. MVCC works not because it eliminates conflict but because it separates concerns cleanly: readers see the past, writers negotiate the present. The best scalability designs borrow this principle — they do not try to eliminate contention, they make contention visible and contain it. A team that understands its own concurrency model does not panic in an incident; it already knows where the lock is.`]},

{sec:"tx",c:"violet",eyebrow:"ACID &amp; Concurrency · Recall",t:"r",h:"Quick recall: ACID and concurrency",qs:[
{q:`Which ACID letter is not entirely the database's job, and why?`,a:`Consistency — the database only enforces invariants you explicitly declared as constraints. Any undeclared business invariant is still the application's responsibility.`},
{q:`What problem does MVCC solve, and what does it NOT solve?`,a:`Solves readers blocking writers (and vice versa) by giving readers a consistent snapshot. Does NOT solve writer/writer conflicts on the same row — that still needs locking or version-checks.`},
{q:`Is a deadlock a bug?`,a:`No — an expected outcome of fine-grained locking with no fixed acquisition order. The database detects and rolls back one participant; the real fix is consistent lock ordering in application design.`}]},

/* ---------- ISOLATION + WAL + RECOVERY ---------- */
{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"q",q:`If Serializable gives the strongest, simplest-to-reason-about guarantee, why doesn't every system just <b>default to it</b>?`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"a",h:"The sliding scale between correctness and throughput",body:`
<div class="ascii">Isolation level    What it stops you from seeing
Read Uncommitted   Nothing extra - dirty reads allowed
Read Committed     Dirty reads only - non-repeatable reads
                     still possible mid-transaction
Repeatable Read    Dirty + non-repeatable - phantom rows
                     still possible in some engines
Serializable       All of the above - behaves as if
                     transactions ran one at a time</div>
<div class="note">Because Serializable is bought with <b>real throughput cost</b> — more aggressive locking, more conflict detection, more transaction aborts under contention. Defaulting every workload to it means paying that cost even for the majority of queries that never needed it, which is why <b>Read Committed is the pragmatic default</b> in most production systems.</div>`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"q",q:`Under Read Committed, a transaction reads the same row twice and gets two different values. Is this a <b>bug</b> in the database?`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"a",h:"The defined behavior of that isolation level",body:`
<p>No — it's the defined behavior. Read Committed only promises you won't see uncommitted data; it explicitly allows another transaction's committed change to become visible between two reads in the same transaction. Calling this a "bug" usually means the isolation level was chosen without understanding what it actually guarantees.</p>`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"q",q:`A financial ledger balance check reads a row, does some logic, then writes based on what it read — all under Read Committed. What specific class of bug does this <b>invite</b>?`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"a",h:"Lost update / race condition",body:`
<p>A classic lost update: two concurrent transactions can both read the same "before" balance, both compute an update based on it, and the second write silently overwrites the first's effect — <strong>with no error raised</strong>, because Read Committed never promised the value would still be true by the time you write. This needs Repeatable Read, Serializable, or explicit row locking (<code>SELECT ... FOR UPDATE</code>).</p>`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"q",q:`Should isolation level be a single global setting for the whole database, or a <b>per-transaction</b> decision?`},

{sec:"iso",c:"rose",eyebrow:"06 · Isolation Levels",t:"a",h:"A per-transaction decision",body:`
<p>A dashboard query reading aggregate stats has very different correctness needs than a fund-transfer transaction touching a ledger — forcing both onto the same global isolation level either over-pays for throughput on the safe query or under-pays for correctness on the risky one. Mature systems set isolation deliberately per transaction boundary.</p>`,
cto:[`Isolation level is the most commonly undecided decision in production SQL systems. Most teams inherit the database default, ship under pressure, and never revisit it — until a correctness incident makes the decision for them, under load, with a customer already affected. The standard I hold: every transaction boundary that touches money, compliance, or user trust must have an explicit isolation-level decision in the design doc. "We used the default" is not a design decision — it is the absence of one.`]},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"q",q:`Why does the database write to a log <b>before</b> touching the actual data page, instead of just updating the data page directly?`},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"a",h:"The unglamorous backbone of durability and speed",body:`
<div class="ascii">update row -> append change to WAL -> ack maybe after WAL durable
  -> data page flushed later (lazily, by buffer manager)
Disk pages &lt;--&gt; Buffer Pool &lt;--&gt; Query Execution
  miss -> load from disk | hit -> use directly, no disk trip</div>
<div class="note">A <b>sequential log append</b> is dramatically cheaper than a <b>random data-page write</b>, and logging the intent first means a crash mid-update leaves enough information to redo or undo the change deterministically. Writing to the data page first, with no log, would leave no reliable way to know what state the page was in mid-crash.</div>`},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"q",q:`If the WAL is durable the moment a transaction commits, does that mean the actual <b>data pages</b> on disk are already up to date at that point?`},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"a",h:"No — and this is the whole point",body:`
<p>The data page is flushed <strong>lazily</strong> by the buffer manager, often well after commit. Durability comes from the guarantee that the WAL alone is sufficient to reconstruct the committed change if the data page write is lost in a crash — not from the data page being current at commit time.</p>`},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"q",q:`The buffer pool caches pages in memory. What decides which page gets evicted when the pool is full and a new page needs to be loaded?`},

{sec:"iso",c:"rose",eyebrow:"07 · WAL &amp; Buffer Manager",t:"a",h:"An eviction policy — and a known trap",body:`
<p>Usually a variant of <strong>LRU (least recently used)</strong> — and getting this wrong under real workloads is a known trap: a single large sequential scan can flush out frequently-accessed "hot" pages of an unrelated workload, since a naive LRU treats "just touched once" the same as "touched repeatedly." Production engines use smarter policies specifically to avoid this.</p>
<div class="note">Is a larger buffer pool always a straightforward win? Not unconditionally — it reduces disk I/O only up to the point where the <b>working set</b> actually fits in memory; beyond that, more memory just caches pages that won't be revisited soon, and it competes with OS-level file caching for physical memory.</div>`,
cto:[`Record intent before action. The WAL's design principle reaches well beyond databases: the cost of documenting what you are about to do is always lower than the cost of reconstructing it after something goes wrong. Write-ahead is not a storage pattern — it is an engineering posture. The teams I trust most have, in effect, a WAL for every major decision: they wrote it down before they executed it, which means recovery — technical or organizational — is always possible.`]},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"q",q:`Why does recovery start from a <b>checkpoint</b> instead of replaying the entire WAL from the very beginning of time?`},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"a",h:"Coming back from an unclean shutdown, provably correct",body:`
<div class="ascii">Crash -> restart -> read checkpoint -> redo committed WAL entries
       -> undo incomplete work if needed
Strong mental model: Recovery = bring data pages back to a
transactionally consistent state, using log + checkpoints -
nothing else.</div>
<div class="note">A checkpoint is a known-good snapshot marker — "everything before this point is already safely on disk." Replaying from the true beginning of the log on every restart would make recovery time grow unboundedly with database age; checkpoints bound recovery time to "work since the last checkpoint," keeping restart times predictable.</div>`},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"q",q:`During recovery, why does the engine need both a <b>redo</b> phase and an <b>undo</b> phase — wouldn't redoing everything in the log be enough?`},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"a",h:"The log contains transactions that never committed",body:`
<p>Because the log contains changes from transactions that <strong>never committed</strong> before the crash — redo alone would resurrect their effects too. Redo brings all logged changes forward first (including uncommitted ones, for simplicity), then undo specifically reverses the effects of transactions never confirmed committed, leaving only truly committed work standing.</p>`},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"q",q:`A transaction's client received no response before a crash — the connection just dropped mid-commit. After recovery, how does the client find out whether that transaction actually committed?`},

{sec:"iso",c:"rose",eyebrow:"08 · Crash Recovery",t:"a",h:"Timeout means unknown, not failed",body:`
<p>The client generally <strong>cannot know from the dropped connection alone</strong> — it has to query the actual current state after reconnecting (was the row updated? does an idempotency-key record exist?) rather than assuming success or failure. Same principle as distributed transaction design, just triggered by a local crash instead of a network partition.</p>
<div class="note">Is a longer interval between checkpoints purely a performance win? No — it's a direct trade against recovery time. Checkpointing costs I/O while running, but stretching the interval means more WAL to replay on the next crash. Checkpoint frequency is a deliberate dial between steady-state overhead and worst-case downtime, not a free performance lever.</div>`,
cto:[`Correctness under failure is the real measure of a system's integrity — not how it behaves when everything works. A system that only functions under ideal conditions has not been tested; it has been rehearsed. Recovery must be mechanical and provable. The same is true of incident response: a team that has never practiced failure is one incident away from its first real test — and that is a poor time to discover what your runbooks actually say.`]},

{sec:"iso",c:"rose",eyebrow:"Isolation, WAL &amp; Recovery · Recall",t:"r",h:"Quick recall: isolation, WAL, and recovery",qs:[
{q:`Why isn't Serializable the safe default everywhere?`,a:`It's bought with real throughput cost — more locking, more conflict detection, more aborts under contention. Read Committed is the pragmatic default because most queries never needed the stronger guarantee.`},
{q:`Why does the WAL get written before the data page, not after?`,a:`A sequential log append is far cheaper than a random data-page write, and logging intent first means a crash mid-update leaves enough information to redo or undo deterministically.`},
{q:`Why does recovery need both redo and undo?`,a:`The log contains changes from transactions that never committed. Redo brings everything forward first (including uncommitted work); undo then reverses anything never confirmed committed.`}]},

/* ---------- REPLICATION + DEPLOYMENT ---------- */
{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"q",q:`If a replica is asynchronous, what specific guarantee does a read from that replica <b>lose</b> compared to reading from the primary?`},

{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"a",h:"Where single-node simplicity runs out",body:`
<div class="ascii">Primary
  +--> Replica 1 (async or sync)
  +--> Replica 2
Primary handles writes. Replicas may serve reads.
Replication ships the WAL/binlog - replicas replay it.

Sharding
customer 1-10000     -> shard A
customer 10001-20000 -> shard B
(a join across shards is no longer a single-node operation)</div>
<div class="note"><b>Read-your-own-write consistency.</b> A write acknowledged on the primary may not have replayed on the replica yet, so a client that writes then immediately reads from a replica can see stale data — the classic "I just updated my profile and it still shows the old value" bug, a direct, predictable consequence of async replication lag, not a rare edge case.</div>`},

{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"q",q:`Synchronous replication removes that staleness risk. Why isn't it the <b>default choice</b> for every system that can afford it?`},

{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"a",h:"Sync trades throughput and availability for consistency",body:`
<p>Because the primary now can't acknowledge a commit until the replica confirms receipt — <strong>write latency becomes bounded by the slowest synchronous replica</strong>, and a replica outage can block writes on the primary entirely. It's the right trade for some data, not for all of it.</p>`},

{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"q",q:`Sharding by customer ID solves the single-node capacity ceiling. What class of query does it make <b>fundamentally harder</b>, not just slower?`},

{sec:"scale",c:"amber",eyebrow:"09 · Replication &amp; Scaling",t:"a",h:"Cross-shard joins",body:`
<p>Any query that needs to <strong>join or aggregate across shards</strong> — the database no longer has a single engine that can execute a join plan across the whole dataset. What was a single query becomes a fan-out-and-merge operation the application has to orchestrate, with its own partial-failure and consistency questions.</p>
<div class="note">Is choosing a shard key reversible once the system is in production with real data? Practically no — one of the most expensive decisions to change later. Re-sharding means migrating live data across shard boundaries while the system stays online, and a poorly chosen key can force exactly that migration under production pressure.</div>`,
cto:[`Every scaling decision converts local simplicity into distributed complexity. The right question is never "can we scale?" — it is "what guarantees do we surrender when we do, and who in this organization understands and owns that trade?" Scale without that answer is deferred risk with a better name. I have never seen a team regret being precise about what they gave up. I have seen many regret discovering it during an outage.`]},

{sec:"scale",c:"amber",eyebrow:"10 · Our Deployment",t:"q",q:`Same platform, wildly different isolation levels per flow — Read Committed as default, Serializable + row locks for the ledger. Why isn't that <b>inconsistent</b>?`},

{sec:"scale",c:"amber",eyebrow:"10 · Our Deployment",t:"a",h:"The Wealth / Demat Platform database footprint",body:`
<div class="ascii">Primary/replica topology: 1 primary + 2 read replicas
Default isolation:        Read Committed
Ledger isolation:         Serializable + row locks
Sharded services:         ~14 of 80+
Checkpoint interval:      5 min (ledger DB)</div>
<div class="ascii">Flow              Access pattern           Index/storage decision
MF order book     write-heavy, point       Clustered on order_id
                    lookup by order_id      (monotonic sequence)
IPO allotment      read-heavy, range scan  Composite index
                    by customer + date       (customer_id, allotment_date)
NSDL demat sync    upsert-heavy, high      MVCC + short transactions
                    write concurrency
LAMF ledger        strict correctness,     Serializable isolation,
                    low volume, high stakes  explicit row locking
Reporting/analytics heavy aggregate scans  Read replica, relaxed
                                             isolation</div>
<div class="note">The deliberate design choice worth naming out loud: Serializable isolation with explicit row locking on the LAMF ledger — not because of convention, but because a lost-update race on a lien balance is a <b>regulatory and financial incident</b>, not a bug ticket. Every other flow deliberately runs at a weaker, faster isolation level because it can afford to.</div>`},

{sec:"scale",c:"amber",eyebrow:"10 · Our Deployment",t:"a",h:"Real-shaped issues this design had to account for",body:`
<ul class="pts">
<li><strong>Lost update on LAMF lien balance under Read Committed</strong> — two concurrent lien-marking requests both read the same balance, both computed a valid-looking deduction, second write silently overwrote the first. <em>Fix:</em> moved to Serializable + <code>SELECT ... FOR UPDATE</code>.</li>
<li><strong>Composite index column order reversed during a migration</strong> — <code>(allotment_date, customer_id)</code> instead of <code>(customer_id, allotment_date)</code>, functionally "same columns," but every customer-scoped query silently fell back to scanning all customers. <em>Fix:</em> version-controlled index definitions with an automated column-order check.</li>
<li><strong>Long-held NSDL sync transaction blocking vacuum</strong> — an external API call kept inside the transaction boundary held an MVCC snapshot open for minutes, silently preventing cleanup platform-wide. <em>Fix:</em> external calls moved entirely outside the transaction boundary.</li>
<li><strong>UUID primary key on the MF order book causing page-split spikes</strong> — random UUID clustering key degraded write throughput. <em>Fix:</em> switched to a monotonic sequence for clustering, kept the UUID as a separate unique secondary index.</li>
<li><strong>Optimizer plan flip after a bulk historical data load</strong> — a two-year backfill changed statistics enough to flip a fast indexed query to a full table scan overnight, zero code changes. <em>Fix:</em> statistics refresh made an explicit, monitored step of every bulk-load runbook.</li>
</ul>
<div class="note">The line worth saying in an interview: <b>"We treat isolation level and index column order as explicit, reviewed design decisions per data flow — most of our correctness incidents came from defaulting to convenient choices, not from the storage engine misbehaving."</b></div>`,
cto:[`Production incidents are design reviews conducted under load, without preparation, with real consequences. Every failure is a decision that was either never made, or made without sufficient understanding of its weight. The engineering culture that treats incidents as learning events — not shame events — compounds its resilience over time. The one that treats them as blame events spends its best engineers' energy on self-protection instead of system improvement. That is a choice leadership makes, usually without realizing it is being made at all.`]},

{sec:"scale",c:"amber",eyebrow:"Replication &amp; Deployment · Recall",t:"r",h:"Quick recall: replication, scaling, and the real deployment",qs:[
{q:`What guarantee does an async replica read lose, and why is it predictable, not rare?`,a:`Read-your-own-write consistency — a write acknowledged on the primary may not have replayed on the replica yet. It's a direct, predictable consequence of async replication lag.`},
{q:`Why isn't sync replication the default even though it removes staleness?`,a:`Write latency becomes bounded by the slowest sync replica, and a replica outage can block writes on the primary entirely — trading throughput and availability for consistency.`},
{q:`Why does the LAMF ledger run at Serializable while everything else runs at Read Committed?`,a:`A lost-update race on a lien balance is a regulatory and financial incident, not a bug ticket — every other flow can afford the weaker, faster isolation level; the ledger cannot.`}]},

/* ---------- LEADERSHIP PERSPECTIVES ---------- */
{sec:"lead",c:"ink",eyebrow:"Rapid Fire",t:"r",h:"Rapid fire — say the &quot;why&quot; out loud, then move on",qs:[
{q:`Why does a SQL database need an optimizer at all, when a KV store never does?`,a:`SQL commits to arbitrary relational access decided at query time — joins, ranges, aggregates — so it must choose HOW to answer each query. A KV store only ever answers one way: get/put by key.`},
{q:`Why does column order matter in a composite index, when both orders "contain" the same columns?`,a:`A B+ tree is sorted only by its leading columns — the order determines what can be sought directly vs. scanned.`},
{q:`Why isn't Serializable isolation the safe default everywhere?`,a:`It costs real throughput — more locking, more conflict detection, more aborts — paid even by queries that never needed the guarantee.`},
{q:`Why does the WAL get written before the data page, not after?`,a:`Sequential log append is cheap; logging intent first means a crash mid-update can be deterministically redone or undone.`},
{q:`Why does MVCC not eliminate the need for locks entirely?`,a:`It solves reader/writer conflict, not writer/writer conflict on the same row — that still needs coordination.`},
{q:`Why can a random-UUID primary key hurt insert performance on a clustered table?`,a:`Inserts land at random points instead of the end, causing constant page splits and fragmentation.`},
{q:`Why does recovery need both redo and undo, not just redo?`,a:`The log holds changes from transactions that never committed — redo alone would resurrect them; undo reverses uncommitted work afterward.`},
{q:`Why can a query that was fast for months suddenly become slow with no code change?`,a:`Plans are a function of data state, not SQL text — statistics drift, row counts cross thresholds, and the optimizer flips plans silently.`},
{q:`Why does async replication risk a client seeing its own write disappear?`,a:`The write may not have replayed to the replica yet when the client's very next read hits it.`},
{q:`Why does sharding make cross-entity joins fundamentally harder, not just slower?`,a:`No single engine can execute a join plan across shards anymore — it becomes an application-orchestrated fan-out-and-merge.`}]},

{sec:"lead",c:"ink",eyebrow:"L1 · Leadership",t:"q",q:`A lien-marking race condition under Read Committed silently double-counts available balance for a few minutes before anyone notices. <b>What does each level of the org see when this surfaces?</b>`},

{sec:"lead",c:"ink",eyebrow:"L1 · Leadership",t:"a",h:"Five minds, one incident: the isolation-level gap",body:`
<p><strong>What happened:</strong> no alert fired because nothing "failed" — both transactions committed successfully. The wrong final balance was only caught two days later during reconciliation, by which point a customer had already been allowed to borrow against balance that wasn't really available.</p>
<ul class="pts">
<li><strong>Developer</strong> — adds a row lock (<code>SELECT...FOR UPDATE</code>) on this specific transaction — fixes this exact code path.</li>
<li><strong>Solutions Architect</strong> — reviews every money-movement transaction platform-wide and formally classifies each one's required isolation level.</li>
<li><strong>CTO</strong> — asks why isolation level was never a reviewed field in the platform's transaction design checklist, across all 80+ services.</li>
<li><strong>Director</strong> — weighs the cost of a platform-wide isolation-level audit against the recurring risk of the next silent miscalculation.</li>
<li><strong>Product Owner</strong> — asks how many customers were affected by the two-day detection gap, and whether balance-affecting actions need real-time reconciliation before "approved" surfaces.</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> How many of our money-touching transactions run at whatever isolation level the DB defaults to, because nobody ever explicitly decided otherwise? <b>Learning:</b> A race condition under Read Committed doesn't throw an error — it just quietly produces a wrong answer that looks completely normal. That's what makes isolation-level choice a design decision, not a performance tuning knob to revisit later.</div>`},

{sec:"lead",c:"ink",eyebrow:"L2 · Leadership",t:"q",q:`A composite index gets rebuilt with reversed column order during a routine migration. Customer-scoped queries silently start scanning the whole table. <b>How does each level read this?</b>`},

{sec:"lead",c:"ink",eyebrow:"L2 · Leadership",t:"a",h:"Five minds: the column-order regression nobody's diff caught",body:`
<p><strong>What happened:</strong> no query changed, no error appeared — response times crept upward over two weeks as the table grew, until finally crossing a timeout threshold during a high-traffic allotment day.</p>
<ul class="pts">
<li><strong>Developer</strong> — recreates the index with correct column order — the immediate query is fast again.</li>
<li><strong>Solutions Architect</strong> — adds automated plan-regression checks that fail a migration if a critical query's <code>EXPLAIN</code> output changes shape.</li>
<li><strong>CTO</strong> — points out index definitions were never treated as tested, version-controlled artifacts with the same rigor as application code.</li>
<li><strong>Director</strong> — asks how many other migrations in the last year touched index definitions without a matching performance regression test.</li>
<li><strong>Product Owner</strong> — asks how gradual the degradation was, and whether "slowly getting slower" needs its own alerting threshold distinct from hard failures.</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> Do we test that our migrations preserve query performance, or only that they preserve schema correctness? <b>Learning:</b> A "functionally equivalent" index change can be a severe performance regression in disguise — column order is invisible in a diff that only checks "which columns are indexed."</div>`},

{sec:"lead",c:"ink",eyebrow:"L3 · Leadership",t:"q",q:`A sync job holds a database transaction open across an external NSDL API call. Table bloat from blocked vacuum starts degrading <b>unrelated</b> queries platform-wide, days later. <b>Trace the leadership readings.</b>`},

{sec:"lead",c:"ink",eyebrow:"L3 · Leadership",t:"a",h:"Five minds: the blast radius nobody could trace",body:`
<p><strong>What happened:</strong> the team investigating the slow, unrelated queries had no obvious reason to suspect a sync job in a completely different service — the connection took real digging to find.</p>
<ul class="pts">
<li><strong>Developer</strong> — moves the external API call outside the transaction boundary — closes this specific gap.</li>
<li><strong>Solutions Architect</strong> — establishes a platform rule: no external network call is ever allowed inside an open DB transaction, plus tooling to auto-detect long-held transactions.</li>
<li><strong>CTO</strong> — flags this as a shared-infrastructure risk: one poorly written service can degrade every other service on the same database instance.</li>
<li><strong>Director</strong> — weighs isolating high-risk services onto separate database instances against the operational complexity cost.</li>
<li><strong>Product Owner</strong> — asks which customer-facing features were degraded, and how long it took to connect the symptom to the cause.</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> Do we monitor for long-held transactions as a platform-wide health signal, or only discover them after their damage shows up somewhere else entirely? <b>Learning:</b> A transaction's blast radius isn't limited to the rows it touches — a long-held transaction anywhere on a shared database can quietly degrade cleanup for everyone else sharing that instance.</div>`},

{sec:"lead",c:"ink",eyebrow:"L4 · Leadership",t:"q",q:`A bulk two-year historical data load flips a fast indexed query to a full table scan overnight — with <b>zero code changes.</b> What does each level assume, and who's right?`},

{sec:"lead",c:"ink",eyebrow:"L4 · Leadership",t:"a",h:"Five minds: the plan flip with no deployment behind it",body:`
<p><strong>What happened:</strong> the on-call engineer initially assumed a deployment had gone wrong, since nothing in the application had changed — stale statistics after a bulk load took longer to find than the fix once identified.</p>
<ul class="pts">
<li><strong>Developer</strong> — manually triggers a statistics refresh — fixes the immediate slowness.</li>
<li><strong>Solutions Architect</strong> — adds an explicit statistics-refresh step to every bulk-load runbook, plus plan-monitoring that alerts automatically on a critical-query plan flip.</li>
<li><strong>CTO</strong> — notes "the SQL didn't change" was treated internally as equivalent to "performance won't change" — asks where else that false assumption might be hiding.</li>
<li><strong>Director</strong> — asks how much on-call time was spent chasing a "deployment broke something" theory before the real cause was found.</li>
<li><strong>Product Owner</strong> — asks whether bulk historical loads should require a mandatory performance-validation window before being considered "done."</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> Do we treat "the query text is unchanged" as proof that performance is safe — and how would we even notice if that assumption were false? <b>Learning:</b> Query performance is a function of data state, not just SQL text. Any operation that materially changes data shape is a performance-risk event, even with zero code deployed.</div>`},

{sec:"lead",c:"ink",eyebrow:"L5 · Leadership",t:"q",q:`A read replica falls behind during a traffic spike. A customer updates their KYC status, checks it on a different screen, and sees the <b>old</b> value. Walk the readings.`},

{sec:"lead",c:"ink",eyebrow:"L5 · Leadership",t:"a",h:"Five minds: the replica lag customers experience as a bug",body:`
<p><strong>What happened:</strong> the customer assumed their update failed and resubmitted it, creating a duplicate KYC update request — support later had to explain nothing was actually wrong, the read had simply hit a lagging replica.</p>
<ul class="pts">
<li><strong>Developer</strong> — routes the immediate post-write read to the primary instead of a replica for this specific screen.</li>
<li><strong>Solutions Architect</strong> — defines a platform-wide rule for which read paths require read-your-write consistency versus which can tolerate replica lag.</li>
<li><strong>CTO</strong> — asks whether replica routing was ever made deliberately per use case, or whether "reads go to replicas" was applied as a blanket rule.</li>
<li><strong>Director</strong> — weighs the primary's added read load from consistency-sensitive routes against the support cost of repeated tickets.</li>
<li><strong>Product Owner</strong> — asks whether the UI should show an optimistic "saved" confirmation immediately after write, rather than relying on a subsequent read to prove it.</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> Which of our screens quietly assume "read after write" consistency without anyone ever checking whether the read actually goes to the primary? <b>Learning:</b> Replica lag isn't a rare edge case under load — it's a designed-in property of async replication that shows up exactly when traffic is highest, which is also when customer experience matters most.</div>`},

{sec:"lead",c:"ink",eyebrow:"L6 · Leadership",t:"q",q:`A service sharded by signup date develops a severely hot shard as recent signups dominate activity, while older shards sit idle. <b>Whose fault is the shard key, and what's the fix?</b>`},

{sec:"lead",c:"ink",eyebrow:"L6 · Leadership",t:"a",h:"Five minds: the shard key that became a bet nobody modeled",body:`
<p><strong>What happened:</strong> the hot shard's latency degraded for a large, disproportionate slice of daily active users, while capacity sat unused elsewhere — and rebalancing meant migrating live data under production load.</p>
<ul class="pts">
<li><strong>Developer</strong> — adds more compute to the hot shard as a stopgap — buys time, doesn't fix the key choice.</li>
<li><strong>Solutions Architect</strong> — designs a re-sharding plan around a hash-based key instead of signup date, to distribute load independent of recency.</li>
<li><strong>CTO</strong> — asks whether shard-key hot-spotting risk was ever modeled before the original key was chosen, or only discovered in production.</li>
<li><strong>Director</strong> — weighs the cost and risk of a live re-sharding migration against over-provisioning the hot shard indefinitely.</li>
<li><strong>Product Owner</strong> — asks which customer segment is silently getting worse latency today, and whether that's acceptable while the migration is planned.</li>
</ul>
<div class="note"><b>The invisible leadership question:</b> Did we choose our shard key by modeling future access patterns, or by whatever column was convenient to partition on at the time? <b>Learning:</b> A shard key isn't just a storage decision — it's a bet on how load will distribute over time. A key that looks reasonable at launch can become the single hardest thing to change once real usage patterns emerge.</div>`},

{sec:"lead",c:"ink",eyebrow:"L7 · Leadership",t:"q",q:`An auditor asks for proof of the exact sequence of balance changes on a LAMF account over the last quarter. The ledger table only stores <b>current balances</b> — no history was retained. What now?`},

{sec:"lead",c:"ink",eyebrow:"L7 · Leadership",t:"a",h:"Five minds: the schema decision wearing a compliance costume",body:`
<p><strong>What happened:</strong> the team can prove the current balance is correct today, but cannot reconstruct the exact sequence and timing of every debit and credit — because the schema was designed for "what is true now," not "what happened, in order."</p>
<ul class="pts">
<li><strong>Developer</strong> — starts writing an append-only transaction log going forward — helps the next audit, not this one.</li>
<li><strong>Solutions Architect</strong> — redesigns the ledger as an append-only event table with balance as a derived, computed value.</li>
<li><strong>CTO</strong> — frames this as a governance gap, not a schema oversight: nobody defined audit-retention requirements before the schema was designed.</li>
<li><strong>Director</strong> — asks whether audit-trail retention was ever a deliberate compliance decision anywhere on the platform, or just defaulted to the simplest schema.</li>
<li><strong>Product Owner</strong> — weighs the ledger redesign against roadmap priorities, but flags that failing this audit outranks most features ahead of it.</li>
</ul>
<div class="note"><b>The invisible leadership question — the one that separates leaders:</b> If a regulator asks for proof of exact sequencing on any of our regulated balances tomorrow, do we know how far back we can actually answer — and was that a deliberate schema decision, or an accident of storing only "current state"? <b>Learning:</b> Append-only history versus mutable current-state is a compliance decision wearing a schema-design costume — and it has to be made before the regulator asks, not after.</div>`,
cto:[`The pattern underneath all seven: developers ask "how do I fix this query or transaction," solutions architects ask "what indexing, isolation, or sharding design caused this and what's the durable fix," CTOs ask "what governance or platform-standard gap let this happen across 80+ services," directors ask "what's the business or compliance cost, and who owns this decision," and product owners ask "how does this affect what the customer sees and trusts, and is it worth prioritizing over the next feature." A leadership role means holding all five at once — and knowing which one should drive the call, each time.`]},

{sec:"lead",c:"ink",eyebrow:"Final Synthesis",t:"a",h:"Final compression",body:`
<p>A SQL database's whole value is that it lets you ask expressive questions declaratively — but every layer beneath that promise is a deliberate trade: pages over rows for disk-aligned I/O, B+ trees over binary trees for shallow disk-bound lookups, MVCC over pure locking so readers and writers stop blocking each other, WAL-before-data-page so a crash mid-write still has a truthful story to recover from, and isolation level chosen per transaction rather than left at whatever the engine defaults to.</p>
<div class="note">The platform's real maturity shows up in whether anyone decided these trade-offs on purpose, not whether the queries happen to return correctly today.</div>`}
];

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  let out='';
  if(cto&&cto.length) out+='<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
  if(dir&&dir.length) out+='<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
  return out;
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  try{
    if(s.t==='q'){
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
        +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
        +'<div class="qtext">'+s.q+'</div>'
        +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
    } else if(s.t==='r'){
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
        +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
        +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
        +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
    } else {
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(((s.cto&&s.cto.length)||(s.dir&&s.dir.length))?lens(s.cto,s.dir):'');
    }
  }catch(err){
    el.innerHTML='<div class="eyebrow rose">Render error</div><h2>Slide '+(i+1)+' failed to render</h2><p>'+String(err&&err.message||err)+'</p>';
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
