{sec:"intro",c:"ink",eyebrow:"Designing a NoSQL Database",t:"a",h:"From outside it is just put and get. <em>Inside it is partitioning, replication, durability, consistency tradeoffs — eighteen problems deep.</em>",body:`
<div class="ascii">Naive view:  App --> put/get --> "the database"
Real view:   App --> Coordinator --> partition owner --> replicas --> disk
                          |
                          v
              which node? how many copies? how fresh? how durable?</div>
<div class="note"><b>The architecture:</b> partitioned storage + replicated state + distributed read/write coordination + consistency tradeoffs + storage-engine design. <b>How to use:</b> think-first slides before each concept, recall quizzes close each section.</div>`},

/* IF YOU BUILD YOUR OWN */
{sec:"own",c:"ink",eyebrow:"Blueprint · Where To Start",t:"q",q:`If you were building your own NoSQL database from scratch, would you start by thinking about SQL-like queries? What should you define first instead — and what should your very first version deliberately NOT support?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Where To Start",t:"a",h:"Start with the contract, not the query language",body:`
<div class="ascii">Minimum external API:

PUT    /v1/collections/{collection}/documents/{id}
GET    /v1/collections/{collection}/documents/{id}
DELETE /v1/collections/{collection}/documents/{id}

POST   /v1/collections/{collection}/query
POST   /v1/collections/{collection}/batch

GET    /v1/health
GET    /v1/metrics</div>
<div class="ascii">Internally, that API should map to:

Put(key, value)
Get(key)
Delete(key)

BatchPut(...)
BatchGet(...)
Query(...)</div>
<div class="note">For a first version, make it primarily a distributed key-value store. Don't attempt arbitrary querying initially — that comes later, once put/get/delete are solid.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · High-Level Architecture",t:"q",q:`Draw your first block diagram: client all the way down to storage. One component in the middle makes a single decision that everything downstream depends on. Which component, and which decision?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · High-Level Architecture",t:"a",h:"The coordinator's one job",body:`
<div class="ascii">                    Client
                      |
                      v
               +--------------+
               | API Gateway  |
               +--------------+
                      |
                      v
             +-------------------+
             | Request Coordinator|
             +-------------------+
                 /       |        \\
                v         v         v
          +---------+ +---------+ +---------+
          | Node 1  | | Node 2  | | Node 3  |
          +---------+ +---------+ +---------+
               |          |           |
               v          v           v
          +---------+ +---------+ +---------+
          | Storage | | Storage | | Storage |
          +---------+ +---------+ +---------+</div>
<div class="note">The important question the diagram doesn't answer yet: how does the coordinator decide which node owns a key? That's partitioning — the next decision.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Partitioning",t:"q",q:`Hash(key) decides a node, in one line. But before that line means anything, you need to answer several separate questions. What are they?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Partitioning",t:"a",h:"Hash(key) hides several decisions",body:`
<div class="ascii">key
 |
 v
Hash(key)
 |
 v
Partition
 |
 v
Responsible node(s)</div>
<div class="ascii">                 Hash("user:123")
                       |
                       v
                  Partition 7
                       |
             +---------+---------+
             |                   |
             v                   v
          Node A              Node B
         (primary)           (replica)</div>
<ul class="pts">
<li>Hash partitioning, or consistent hashing?</li>
<li>How many partitions?</li>
<li>How does a node join?</li>
<li>How does a node leave?</li>
<li>How is data rebalanced?</li>
<li>How does the client/coordinator know partition ownership?</li>
</ul>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Replication",t:"q",q:`What happens if Node A dies? "Replication factor 3" sounds like one decision — but the diagrams below hide several more. What are they?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Replication",t:"a",h:"Replication factor 3 is not one decision",body:`
<div class="ascii">              Partition 7
                   |
          +--------+--------+
          |                 |
          v                 v
      Node A             Node B
     Primary             Replica
          |
          v
       Node C
      Replica</div>
<div class="ascii">Replication factor = 3

Write:
Client
  -> Coordinator
      -> A
      -> B
      -> C

Read:
Client
  -> Coordinator
      -> A</div>
<ul class="pts">
<li>Synchronous vs asynchronous replication?</li>
<li>Quorum reads/writes?</li>
<li>What happens when a replica is unavailable?</li>
<li>Replica recovery?</li>
<li>Replica lag?</li>
<li>Read repair?</li>
<li>Hinted handoff, if you want it?</li>
</ul>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Consistency Model",t:"q",q:`WRITE(key, value) returns 200 OK. Does that mean only Node A has the value — or A+B, or A+B+C? With N=3, W=2, R=2, what can you now guarantee — and what happens when Node A says value=X while Node B says value=Y?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Consistency Model",t:"a",h:"200 OK means whatever you decided it means",body:`
<div class="ascii">WRITE(key, value)

If the write returns 200 OK, does that mean:

A has it?
A + B have it?
A + B + C have it?</div>
<div class="ascii">N = 3
W = 2
R = 2

-> quorum consistency: W + R > N guarantees overlap</div>
<div class="ascii">Node A says:
value = X

Node B says:
value = Y

-> you need a conflict resolution rule, decided in advance</div>
<div class="note">This is the same N/W/R overlap logic already covered under Read, Consistency &amp; Schema — the discipline here is deciding it before day one, not discovering it during an incident.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Storage Engine",t:"q",q:`Go inside a single database node. What's the block diagram from write path to disk — and where exactly does the LSM flow (WAL, memtable, SSTable, compaction) sit inside it?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Storage Engine",t:"a",h:"Inside one node: write path and read path split immediately",body:`
<div class="ascii">             Database Node
                  |
          +-------+-------+
          |               |
          v               v
      Write Path       Read Path
          |               |
          v               v
      WAL / Log        Memtable
          |               |
          v               v
       Memtable        SSTables
          |               |
          +-------+-------+
                  |
                  v
             Disk / SSD</div>
<div class="ascii">For an LSM-tree-style design:

Write
  |
  v
WAL
  |
  v
Memtable
  |
  | flush
  v
SSTable
  |
  | compaction
  v
Merged SSTables</div>
<div class="note">You don't need to implement this on day one, but the architecture should account for it from the start — retrofitting a storage engine underneath a live API is much harder than designing the API around one.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Read Path",t:"q",q:`Draw the complete request flow for GET /users/123, all the way down to Memtable, Bloom Filter, Block Cache and SSTable. What do you do if the first replica you ask doesn't have the value?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Read Path",t:"a",h:"The full read path, end to end",body:`
<div class="ascii">GET /users/123
       |
       v
API Server
       |
       v
Coordinator
       |
       v
hash("users/123")
       |
       v
Partition 17
       |
       v
Replica Nodes
       |
       v
+-------------------+
| Memtable           |
| Bloom Filter       |
| Block Cache        |
| SSTable            |
+-------------------+
       |
       v
    Result
       |
       v
    Client</div>
<div class="note">If the first replica doesn't have it — that's not a dead end, it's where your consistency model and replica-selection logic actually get used. Try another replica? Return stale? Both are valid, but only if you decided which one on purpose.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Write Path",t:"q",q:`Same exercise for a write. Client to ACK — walk every hop. Which of the branches after "Primary Replica" could each fail independently, and does the client still get an ACK?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Write Path",t:"a",h:"The full write path, end to end",body:`
<div class="ascii">Client
  |
  v
API
  |
  v
Coordinator
  |
  v
Partitioner
  |
  v
Primary Replica
  |
  +----> WAL
  |
  +----> Memtable
  |
  +----> Replica 2
  |
  +----> Replica 3
  |
  v
ACK</div>
<div class="note">Now you've got a concrete system to reason about — every failure question on the next slide is really asking: which of these branches failed, and does the client still get an ACK?</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Failure Handling",t:"q",q:`Coordinator gets a checkmark from A, a checkmark from B, and a cross from C. Do you return success to the client? If yes — when does C recover, and how does it discover what it missed?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Failure Handling",t:"a",h:"Ten failure modes you need explicit answers for",body:`
<ul class="pts">
<li>Node crashes</li>
<li>Network partition</li>
<li>Disk failure</li>
<li>Coordinator crashes</li>
<li>Replica crashes</li>
<li>Data corruption</li>
<li>Slow node</li>
<li>Duplicate request</li>
<li>Lost ACK</li>
<li>Partial write</li>
</ul>
<div class="ascii">Client
  |
  v
Coordinator
  |
  +----> Node A  OK
  |
  +----> Node B  OK
  |
  +----> Node C  FAIL</div>
<div class="note">Do you return success? If yes, when does C recover, and how does it discover what it missed? There's no universally correct answer — but there has to be a decided one.</div>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Cluster Membership",t:"q",q:`Who tells the coordinator which nodes are alive right now, and which partitions each one currently owns?`},

{sec:"own",c:"ink",eyebrow:"Blueprint · Cluster Membership",t:"a",h:"Cluster management: the layer above partitioning",body:`
<div class="ascii">              Cluster Manager
                    |
       +------------+------------+
       |            |            |
       v            v            v
     Node A        Node B       Node C</div>
<ul class="pts">
<li>Node registration</li>
<li>Health checks</li>
<li>Heartbeat</li>
<li>Failure detection</li>
<li>Partition ownership</li>
<li>Rebalancing</li>
<li>Adding/removing nodes</li>
</ul>`},

{sec:"own",c:"ink",eyebrow:"Blueprint · The Minimum Design Checklist",t:"a",h:"Twelve questions, answered before you write a line of storage code",body:`
<ul class="pts">
<li>What is my data model?</li>
<li>What are my APIs?</li>
<li>What operations do I support?</li>
<li>How do I partition data?</li>
<li>How do I find the node responsible for a key?</li>
<li>How do I replicate data?</li>
<li>What consistency guarantee do I provide?</li>
<li>What does the read path look like?</li>
<li>What does the write path look like?</li>
<li>How is data persisted on disk?</li>
<li>What happens when nodes/network/disk fail?</li>
<li>How does the cluster scale and rebalance?</li>
</ul>
<div class="ascii">                         CLIENT
                            |
                            v
                     +-------------+
                     | API SERVER  |
                     +-------------+
                            |
                            v
                    +---------------+
                    |  COORDINATOR  |
                    +---------------+
                            |
                     Partitioning
                            |
              +-------------+-------------+
              |             |             |
              v             v             v
           Partition 1   Partition 2   Partition 3
              |             |             |
           +--+--+       +--+--+       +--+--+
           |     |       |     |       |     |
           v     v       v     v       v     v
          N1     N2      N3    N4      N5    N6
           |             |             |
           v             v             v
       +--------------------------------------+
       |          STORAGE ENGINE              |
       |                                      |
       | WAL -> Memtable -> SSTable -> Disk   |
       |                                      |
       | Bloom Filter / Cache / Compaction     |
       +--------------------------------------+</div>
<div class="note">If you mean literally building your own NoSQL database: start with a single-node key-value store, then add persistence, then replication, then partitioning, then consensus/cluster membership, then rebalancing — in that order. Don't start with the distributed version; the design explodes very quickly otherwise.</div>`},

/* MENTAL MODEL + CHOOSING */
{sec:"model",c:"teal",eyebrow:"Foundation · Mental Model",t:"q",q:`Before picking a NoSQL type, write down your three most important read patterns. Why does this step have to come <b>before</b> any database choice — and what is the consequence of skipping it?`},

{sec:"model",c:"teal",eyebrow:"Foundation · Mental Model",t:"a",h:"Read pattern first, model second",body:`
<div class="ascii">Key-Value:    user:1001 -> {opaque blob}    bet: pure lookup by key
Document:     user:1001 -> {name,city,orders:[]} bet: semi-structured,
                                                  read-together fields
Wide-Column:  partition=user, rows ordered by time  bet: huge rows,
                                                      time-ordered range
Graph:        nodes + edges + traversals           bet: relationships
                                                    ARE the query</div>
<div class="note">If you design the data model first, you lock your storage shape before knowing your query shapes. The partition key can only be one thing — and it should match your dominant read pattern. Choosing the wrong NoSQL family is an application-shape problem (every query and index assumes the wrong model), not a data-layout problem. It usually means a rewrite, not a migration.</div>`,
cto:[`Before you pick a database type, write down your three most important read patterns. The database shape should follow the query shape, not the other way around.`]},

{sec:"model",c:"teal",eyebrow:"Foundation · Choosing the Model",t:"q",q:`"All transactions for customer 1001, newest first." Which family fits best, and why? Then: "Who are all beneficiaries connected to this account, 3 hops away?" Same answer?`},

{sec:"model",c:"teal",eyebrow:"Foundation · Choosing the Model",t:"a",h:"Shallow adjacency vs. deep traversal",body:`
<p><strong>All transactions, newest first:</strong> Wide-column. Partition by <code>customer_id</code>, cluster/sort by <code>created_at desc</code> — the storage layout itself matches the query, so it's a sequential scan on disk rather than scatter-gather.</p>
<p><strong>3-hop beneficiary graph:</strong> Graph store. A document store makes you either denormalize relationships (which goes stale) or perform multiple round-trip lookups per hop. A graph store makes traversal the native operation.</p>
<div class="note">Twitter-like follow graph: huge adjacency lists, shallow traversals. LinkedIn-style 2nd/3rd-degree: traversal richness matters. Same domain ("social graph") — different problems, different right answer. If app always reads/writes the entire blob and never queries internals, key-value is simpler. If app needs to query or partially update fields inside the object, document fits better. Right answer depends on query granularity, not on which sounds more modern.</div>`},

{sec:"model",c:"teal",eyebrow:"Mental Model · Recall",t:"r",h:"Quick recall: choosing the model",qs:[
{q:`Why must you enumerate read patterns before choosing the NoSQL family?`,a:`The partition key can only be one thing. Designing the model first, then discovering the query doesn't fit, usually means a rewrite — not a migration — because every index and query assumed the wrong storage shape.`},
{q:`What's the key difference between a "shallow adjacency" problem and a "deep traversal" problem, and which family fits each?`,a:`Shallow adjacency (who follows me, who do I follow) = wide-column with partition by user_id. Deep traversal (2–3 hop paths, community detection) = graph store where traversal is the native operation.`}]},

/* PARTITION + REPLICATE + WRITE */
{sec:"part",c:"gold",eyebrow:"02 · The Real Heart: Partitioning",t:"q",q:`An IPO opens and everyone hits the same <code>scheme_id</code> on allotment day. Range partitioning by <code>scheme_id</code> — good or bad, and why does the shard key choice matter more than almost any other design decision?`},

{sec:"part",c:"gold",eyebrow:"02 · The Real Heart: Partitioning",t:"a",h:"Partition key is the most consequential decision",body:`
<div class="ascii">key = user:1001
  -> hash(key)
  -> partition 17
  -> node N2

Range partitioning: user_id 1-10000 -> shard 1
  + range scans easier
  - hotspots possible (all recent IDs on shard N)

Hash partitioning: hash(user_id) % N
  + better spread
  - range queries need scatter-gather

IPO scheme_id + range partitioning = ALL traffic on one shard.
Hash partitioning + composite key (hash bucket + range) = both.</div>
<div class="note"><b>The partition key is the most important design decision in a distributed database.</b> A bad key creates hot spots that no amount of hardware can fix. Partitioning decides WHERE data lives. Replication decides HOW each split survives failure. Treat these as two independent design decisions, not one.</div>`,
cto:[`The partition key is the most consequential decision in a NoSQL design — more than the consistency model, more than the storage engine. Get it wrong and every query fights the data layout. Get it right and everything else is tuning.`]},

{sec:"part",c:"gold",eyebrow:"03 · Replication",t:"q",q:`Replication factor 3. A write is acknowledged after 1 of 3 replicas confirms. Is this durable? What is the difference between leader-based and leaderless replication for this scenario?`},

{sec:"part",c:"gold",eyebrow:"03 · Replication",t:"a",h:"Durability is a threshold, not a property",body:`
<div class="ascii">Leader-based:
  Partition P17 -> Leader Node A -> Replica B, Replica C
  Simple consistency. Failover pause when leader dies.
  New leader from lagging replica can serve stale data as current.

Leaderless / quorum:
  P17 copies on A, B, C -- all can accept reads/writes
  W + R > N  -> strong freshness guarantee (no leader needed)
  W=1, R=1  -> fastest, weakest, no quorum overlap</div>
<div class="note">Replication factor 3 gives 3x storage redundancy. But if write is acked after 1 of 3 replicas, you have single-node durability — not 3x durability. Durability = the threshold that was crossed, not how many copies eventually exist. And replicas placed in the same rack? A rack power event takes them all — replica placement must model realistic failure domains, not just count machines.</div>`},

{sec:"part",c:"gold",eyebrow:"04 · Write Path Defines Durability",t:"q",q:`A client does <code>PUT key=K value=V</code>. Walk every decision inside that write path — and explain why "when the client gets ack" is the single most important durability design decision.`},

{sec:"part",c:"gold",eyebrow:"04 · Write Path Defines Durability",t:"a",h:"Every step in the write path is a durability choice",body:`
<div class="ascii">Client -> Coordinator -> Leader for partition P
   |
   +--> append to WAL / commit log  (durable first)
   +--> update memtable             (fast in-memory)
   +--> replicate to followers       (survive node loss)
   |
   v
 ack client  <-- WHEN exactly? this is the design decision

Option A: ack after leader memory only        -> fastest, weakest
Option B: ack after leader WAL durable        -> survives leader crash
Option C: ack after replication quorum        -> survives node loss
Option D: ack after all replicas              -> slowest, strongest</div>
<div class="note">Write path design directly determines the consistency model — not as a separate decision. A system that acks after 1 replica cannot honestly claim strong read-your-writes consistency later. The write path already decided that promise couldn't be kept. And why WAL before memtable? If you crash after updating memory but before the WAL write lands, that write never happened as far as any replay is concerned.</div>`},

{sec:"part",c:"gold",eyebrow:"Partition, Replication &amp; Write · Recall",t:"r",h:"Quick recall: partitioning, replication, write path",qs:[
{q:`Replication factor 3 with W=1. Is this durable? Why or why not?`,a:`No — durability depends on how many copies must ACK, not how many eventually exist. With W=1, you have 3x storage redundancy but single-node-level durability. If the leader crashes before replicating, the data is lost.`},
{q:`Why does the write path determine the consistency model — not as a separate decision?`,a:`How many replicas must ACK before the client hears "success" IS the write-side half of the consistency contract. Acking after 1 of 3 replicas makes strong read-your-writes impossible to promise later.`},
{q:`What's the key difference between leader-based and leaderless replication?`,a:`Leader-based: simpler consistency story (one authoritative writer), failover pause when leader dies. Leaderless: no single write unavailability point, but correctness depends on quorum math (W+R>N) and conflict resolution.`}]},

/* READ + CONSISTENCY + SCHEMA */
{sec:"read",c:"violet",eyebrow:"05 · Read Path and Staleness",t:"q",q:`A customer redeems mutual fund units and sees the pre-redemption balance 300ms later. Where did the staleness come from — and what are the two costs of fixing it?`},

{sec:"read",c:"violet",eyebrow:"05 · Read Path and Staleness",t:"a",h:"Replica lag is designed-in, not a bug",body:`
<div class="ascii">GET key=K:
  Coordinator -> find partition P
  -> read from leader   (freshest, less scalable)
  OR
  -> read from replica  (scales reads, may be stale)

The staleness came from: replica hadn't received the async
replication from the leader that accepted the write.

Fix: read-your-writes consistency
  -> route that client's subsequent reads to leader (or
     caught-up replica) for a window after their write
  Cost 1: sticky routing complexity
  Cost 2: reduced read scalability for that client</div>
<div class="note">Is "just always read from the leader" automatically the safe default? No — it collapses the entire read scalability benefit that replicas exist to provide. The leader becomes a bottleneck for both reads and writes. Correct for data where freshness genuinely matters more than scale. Not a universal safe default. Can two reads for the same key milliseconds apart correctly return different values with no bug? Yes — expected, designed-for behavior under eventual consistency.</div>`},

{sec:"read",c:"violet",eyebrow:"06 · Consistency Model",t:"q",q:`W+R > N gives stronger consistency without a single leader. Explain the mathematics — and then explain why "eventual consistency" without a bound is operationally meaningless.`},

{sec:"read",c:"violet",eyebrow:"06 · Consistency Model",t:"a",h:"Quorum overlap by pigeonhole",body:`
<div class="ascii">N=3, W=2, R=2: 2+2=4>3 -> overlap guaranteed
N=3, W=1, R=1: 1+1=2<=3 -> overlap NOT guaranteed

W+R > N: the set of replicas that accepted the write and
the set queried by the read MUST share at least one node.
That node has the latest value. Overlap by pigeonhole.
No leader needed for this guarantee.

"Eventual" without a bound:
  "Eventually consistent" sounds like a guarantee.
  It isn't. "Eventually" could mean 10ms or 10 hours.
  Mature systems replace "eventually" with a measured
  replication lag distribution (p50/p99 convergence time).</div>
<div class="note">Strong consistency is never "free" in a distributed system. It always costs latency (waiting for quorum acks or leader round-trips), availability (rejecting writes/reads during partitions), or both. The CAP trade-off doesn't disappear because a vendor markets "strongly consistent" — it just moves to wherever the vendor chose to pay the cost.</div>`,
cto:[`Consistency is not free. Strong consistency costs latency or availability. Eventual consistency costs time before the data is reliable. Choose based on what your users actually need — not on a default you inherited.`]},

{sec:"read",c:"violet",eyebrow:"07 · Access-Pattern Design",t:"q",q:`A team designs a NoSQL table by mirroring their SQL schema table-for-table. What is the predictable failure mode — and what does "schemaless" actually mean?`},

{sec:"read",c:"violet",eyebrow:"07 · Access-Pattern Design",t:"a",h:"Schema didn't disappear — it moved",body:`
<div class="ascii">SQL schema mirrors in NoSQL -> every join becomes:
  scatter-gather across partitions  (slow)
  OR
  chain of sequential app-level lookups  (fragile)

Need: "all orders for customer 1001 sorted by newest"
Weak model:  partition by order_id, hope a secondary index saves you
Strong model: partition by customer_id, cluster/sort by created_at desc

"Schemaless" doesn't mean no schema.
It means the schema moved into your code and your access patterns.
Undesigned, it surfaces as a production performance incident.</div>
<div class="note">Why is listing every access pattern before writing a single line of schema the highest-leverage step in NoSQL design? Because the partition key decision is expensive to reverse, and it can only be made correctly if every query the data must serve is known upfront. Skipping this doesn't remove the schema decision — it defers it to production.</div>`},

{sec:"read",c:"violet",eyebrow:"Read, Consistency &amp; Schema · Recall",t:"r",h:"Quick recall: read path, consistency, schema",qs:[
{q:`N=3, W=2, R=2. Why does this guarantee overlap without needing a leader?`,a:`2+2=4>3 means the write-accepting replica set and the read-querying replica set must share at least one node (pigeonhole). That shared node has the latest value, giving the read a freshness guarantee without any coordination.`},
{q:`Why is "eventually consistent" without a bound operationally meaningless?`,a:`It makes no promise about the staleness window — "eventually" could be milliseconds or hours. Mature systems replace it with a measured replication lag distribution (p50/p99 convergence time) that downstream consumers can reason about.`},
{q:`What does "schemaless" actually mean, and why is it dangerous?`,a:`Schema didn't disappear — it moved into code and access patterns. Without deliberate design, the partition key is chosen wrong and the system surfaces as a performance incident in production rather than a design review comment.`}]},

/* INDEXING + STORAGE + ROUTING */
{sec:"adv",c:"rose",eyebrow:"08 · Secondary Indexing",t:"q",q:`Primary-key lookup is easy. Now you need "find by email." The email index lives on a different partition than the user record. What consistency problem does this reintroduce?`},

{sec:"adv",c:"rose",eyebrow:"08 · Secondary Indexing",t:"a",h:"Secondary index = second independently-partitioned dataset",body:`
<div class="ascii">Main record:   user_id -> document   (partition by user_id)
Email index:   email -> user_id       (different partition, by email)

Write document:
  1. update primary storage
  2. update secondary index  <- TWO writes, TWO partitions, ONE op

If write 2 fails or lags -> index points to stale or nonexistent record.

Local secondary index:  co-located with base data, cheap but
  only useful if query already knows partition key.
Global secondary index: partitioned independently, supports queries
  without partition key, but asynchronous propagation = staleness window.</div>
<div class="note">A user updates their email. A query "find by old email" briefly still returns a match. Is this a bug? Usually not — the visible edge of asynchronous secondary index propagation. Whether it's acceptable depends entirely on whether that index was designed for strongly consistent or eventually consistent lookups. The team's job is to know which promise was made, not to be surprised by it.</div>`},

{sec:"adv",c:"rose",eyebrow:"09 · Storage Engine Choice",t:"q",q:`B-tree style vs. LSM style for a NoSQL store — which wins on write throughput, and what do you pay for that win?`},

{sec:"adv",c:"rose",eyebrow:"09 · Storage Engine Choice",t:"a",h:"Write throughput vs. read amplification",body:`
<div class="ascii">B-tree style:  data updated in place, page-oriented
  + good for point lookups and range access
  - random writes under heavy load -> fragmentation

LSM style:  writes -> WAL -> memtable -> flush -> SSTable -> compaction
  + fast writes (sequential appends, no random I/O)
  - read amplification (key spread across multiple SSTables)
  - compaction: CPU/IO-heavy background process
  - a write burst outpacing compaction -> p99 read latency spikes</div>
<div class="note">LSM is popular in modern NoSQL for write-heavy distributed systems. But if your workload is point-lookup-heavy with a stable moderate write rate, a B-tree engine may serve it with more predictable latency and no compaction overhead to manage. LSM earns its complexity specifically under write-heavy, append-dominated workloads. <b>The storage engine isn't an implementation detail — it sets your write/read trade-offs for the life of the system.</b></div>`,
cto:[`The storage engine isn't just an implementation detail — it sets your write/read trade-offs for the life of the system. Choose it as deliberately as you choose your data model.`]},

{sec:"adv",c:"rose",eyebrow:"09b · LSM Tree, Slowed Down",t:"q",q:`An LSM store never updates data in place — every write is an append, first to a log, then to memory, then to disk. Trace one write from client to disk through WAL &rarr; memtable &rarr; SSTable &rarr; compaction. What is the system getting in return for giving up in-place updates — and what does it owe back later?`},

{sec:"adv",c:"rose",eyebrow:"09b · LSM Tree, Slowed Down",t:"a",h:"Write fast now, organize later",body:`
<div class="ascii">Think of a shop receiving 1000 orders/second. Instead of filing
each order neatly right away, you write it in a notebook fast,
then organize the notebooks later. That's an LSM tree.

              WRITE
                |
                v
        +---------------+
        |      WAL      |   <- safety copy, durable before ack
        +-------+-------+
                v
        +---------------+
        |    Memtable   |   <- fast, sorted, in RAM
        +-------+-------+
                | full, flush
                v
        +---------------+
        |   SSTable 1   |   <- sorted, immutable, on disk
        +---------------+
   memtable fills again -> SSTable 2
   memtable fills again -> SSTable 3 ...

Disk ends up with many SSTables:
  SSTable 1 | SSTable 2 | SSTable 3 | SSTable 4 ...</div>
<div class="ascii">Then COMPACTION: "too many files — combine them."
  SSTable 1 --\\
  SSTable 2 ---+--> COMPACTION --> SSTable BIG
  SSTable 3 --/

  Before:  SSTable1 A=10, SSTable2 A=20, SSTable3 A=30 (latest)
  After:   SSTable BIG -> A=30
  Old / duplicate versions removed, cleaner file left behind.</div>
<div class="ascii">READ A — the trade-off surfaces here:
             READ A
                |
        +-------+-------+
        v       v       v
    SSTable1 SSTable2 SSTable3
      A=10    A=20    A=30  <- latest, but which file has it?
Blindly scanning every SSTable doesn't scale — this is exactly
why indexes / Bloom filters exist: skip files that can't possibly
hold the key before touching disk.</div>
<div class="note"><b>Remember just this:</b> LSM = write fast now, organize later. Memtable = fast temporary buffer. SSTable = sorted, immutable disk file. Compaction = merge/clean those files. Writes become sequential appends (RAM &rarr; sequential disk write) instead of jumping around to modify existing data — that's the write-throughput win from the earlier slide. The bill comes due on reads (checking multiple SSTables) and on compaction (a CPU/IO-heavy background job competing with production traffic) — the exact p99 spike already flagged for LSM engines under a write burst.</div>`},

{sec:"adv",c:"rose",eyebrow:"10–11 · Routing and Rebalancing",t:"q",q:`A client caches the partition map. A rebalance happens and one partition moves to a new node. The client's cache is stale. What silently goes wrong — and why is rebalancing harder than the original partitioning decision?`},

{sec:"adv",c:"rose",eyebrow:"10–11 · Routing and Rebalancing",t:"a",h:"Routing and live migration",body:`
<div class="ascii">Stale partition map:
  Client routes to old node -> node no longer owns partition
  -> avoidable errors / retries
  OR -> stale node silently serves reads from data it's not
        authoritative for (worse than an error)

Why rebalancing is harder:
  Original partitioning: offline decision, no live traffic
  Rebalancing: data must move while system stays live
    - writes may still arrive for the partition being moved
    - ownership must switch atomically (no double-owner,
      no lost-write window)
    - migration consumes same network/disk as production traffic

Hot partition relief paradox:
  Add a node to relieve a hot key -> hot KEY doesn't move to new node
  -> single popular key still served by one node
  -> only fixes hotspots from uneven distribution, not access skew</div>`},

{sec:"adv",c:"rose",eyebrow:"10–11b · The Hot Partition Problem",t:"q",q:`A single key is taking 100,000 requests a second, all landing on one node. You add a second node to the cluster to relieve the load. Does that key's traffic drop? Why or why not — and why is this a fundamentally different problem from the rebalancing you just walked through?`},

{sec:"adv",c:"rose",eyebrow:"10–11b · The Hot Partition Problem",t:"a",h:"Rebalancing fixes distribution, not a single hot key",body:`
<div class="ascii">1. Routing, restated simply:
  Client -> Partition Map -> Node A
  Map goes stale:
    Client thinks Node A owns the data
    Actually Node B owns it now
    -> error/retry, or worse: Node A quietly serves stale data

2. Rebalancing = moving data while the system stays live:
  Before:  Node A -> Partition P1     Node B -> Partition P2
  P1 grows too large -> move P1 from A to B
  Users are still reading/writing P1 during the move. Must hold:
    no lost writes  /  no two owners  /  no downtime
  The move itself consumes network + disk, competing with
  normal production traffic the whole time.

3. Hot partition -- a different problem entirely:
      100,000 requests
             |
           Key X
             |
          Node A  (hot)

  Add Node B:
    Node A  (still hot)  <- Key X
    Node B  (idle)
  Key X still belongs to ONE partition/node. Adding capacity
  elsewhere does not redistribute traffic for that one key.</div>
<div class="note"><b>Key takeaway:</b> rebalancing fixes uneven <em>data</em> distribution across nodes. It does not automatically fix a single extremely hot <em>key</em> — that needs a different fix entirely (splitting the key's traffic across replicas, request-level sharding of that one key, or a cache in front of it). Diagnose which problem you actually have before reaching for "just add a node."</div>`},

{sec:"adv",c:"rose",eyebrow:"Indexing, Storage &amp; Routing · Recall",t:"r",h:"Quick recall: indexing, storage engine, routing",qs:[
{q:`Why does adding a secondary index reintroduce a consistency problem the primary key design had already avoided?`,a:`Updating a record now requires two writes to two independently-partitioned datasets. If the index write lags or fails, the index points to a stale or nonexistent record — a cross-partition atomicity problem the single primary key never had.`},
{q:`What's the key operational risk of LSM under a write burst?`,a:`Writes can outpace compaction, spreading a key's value across many unmerged SSTables. Reads must check more files (read amplification), and compaction itself competes with production reads for I/O — p99 latency spikes after batch jobs are a classic symptom.`}]},

/* FAILURE + REPAIR + EDGES */
{sec:"ops",c:"amber",eyebrow:"12 · Failure Handling",t:"q",q:`Map the failure surface: Client → Router → Leader → Replicas → Disk. Which two failure modes are hardest to detect and hardest to recover from?`},

{sec:"ops",c:"amber",eyebrow:"12 · Failure Handling",t:"a",h:"Failure at every arrow",body:`
<div class="ascii">Case 1 — Node crash: leader dies -> new leader from lagging replica
  -> may serve stale data as current

Case 2 — Network partition: split-brain
  both sides accept writes for the same partition
  when partition heals: two conflicting histories, no clear winner
  MOST DANGEROUS for ledger-like data

Case 3 — Disk crash: needs log replay / replica recovery

Hardest to detect:
  Replica drift: replicas can drift even under healthy operation
  (async replication = there's always propagation delay)
  Anti-entropy/repair must run continuously as background job</div>
<div class="note">Split-brain: two regions accept conflicting writes, both believe they are authoritative. When partition heals, two conflicting histories with no obvious resolution. For cache-like data: tolerable (last-write-wins). For regulated financial data: catastrophic. The architecture must encode which failure mode is acceptable before choosing the topology.</div>`},

{sec:"ops",c:"amber",eyebrow:"13–14 · Repair, Transactions, TTL",t:"q",q:`"Update account balance AND write to transaction log atomically." Why is this dramatically harder in NoSQL — and what is the operationally correct mental model for TTL expiry?`},

{sec:"ops",c:"amber",eyebrow:"13–14 · Repair, Transactions, TTL",t:"a",h:"Cross-partition atomicity and logical vs physical deletion",body:`
<div class="ascii">Multi-key atomic update:
  account + transaction_log -> likely on different partitions
  NoSQL: single-key/single-document atomicity is the strong guarantee
  Multi-partition: needs explicit distributed transaction protocol
  (two-phase commit, or DB-native multi-doc transaction)
  Deliberate, expensive feature -- not a default.

Anti-entropy repair:
  Replica A has latest, Replica B missed update
  Use Merkle-like summaries: hash large ranges first, drill into
  only the sub-ranges that differ -> O(drift) not O(all data)

TTL:
  session:123 created 10:00 TTL=24h
  -> logically expired at 10:00 next day (excluded from reads)
  -> physically deleted later by background compaction
  "Expired" does NOT mean "gone" for compliance purposes.
  These are two different guarantees.</div>`},

{sec:"ops",c:"amber",eyebrow:"17 · Multi-Region",t:"q",q:`Multi-writer multi-region replication: a brief network partition leaves both regions accepting writes to the same key. When the partition heals, who decides which write is real?`},

{sec:"ops",c:"amber",eyebrow:"17 · Multi-Region",t:"a",h:"Conflict resolution must be decided before it's needed",body:`
<div class="ascii">Region A <----> Region B
Both accept writes to key K during partition.
Partition heals -> two conflicting histories.

Options:
  Last-write-wins (LWW by timestamp) -> clock skew makes this wrong
  Vector clocks                       -> correct causality, complex
  CRDT                                -> automatic merge, limited types
  Application-specific merge rules    -> most correct, most work

The dangerous default: no conflict policy defined -> database
  picks LWW silently -> nobody decided this was acceptable.</div>
<div class="note">Multi-writer replication buys availability by giving up a single source of truth during conflicts. That's a legitimate trade for some data (cache, feed items) and a dangerous one for regulated data (balances, ledger entries). The critical governance question: for every dataset on multi-writer replication today, can you name the conflict-resolution rule in one sentence — and was it a deliberate decision, or the database's undocumented default?</div>`},

{sec:"ops",c:"amber",eyebrow:"Final Recall",t:"r",h:"Final: NoSQL design compressed",qs:[
{q:`The one question that should be answered before any NoSQL design begins?`,a:`"What are my three most important read patterns and at what scale?" The partition key can only be one thing, and it must match the dominant read pattern — discovering this after the fact means a rewrite, not a migration.`},
{q:`Why is multi-key atomicity across partitions "deliberate and expensive" rather than a default?`,a:`Most NoSQL engines guarantee only single-key/single-document atomicity. Records on different partitions need an explicit distributed transaction protocol (2PC or a DB-native multi-doc feature), which adds coordination cost and complexity not present in the base design.`},
{q:`Name the two different guarantees that TTL must distinguish for compliance purposes.`,a:`Logical expiry (data excluded from reads — fast, programmatic) vs. physical deletion (data actually removed from storage — happens later via background compaction). "Expired" ≠ "gone" for any compliance requirement that says data must not exist.`}]}
];

let i=0;
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),
tabs=document.getElementById('tabs'),counter=document.getElementById('counter'),
prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.dataset.c=s.c;b.dataset.sec=s.id;b.textContent=s.label;b.onclick=()=>go(S.findIndex(x=>x.sec===s.id));tabs.appendChild(b);});
S.forEach((sl,k)=>{const d=document.createElement('span');d.className='dot'+(sl.t==='q'?' q':'');d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label','Slide '+(k+1));d.onclick=()=>go(k);d.onkeydown=e=>{if(e.key==='Enter')go(k)};dots.appendChild(d);});
function lens(cto,dir){
  let out='';
  if(cto&&cto.length) out+='<details class="lens"><summary>CTO LENS</summary><div class="body"><ul class="pts">'+cto.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
  if(dir&&dir.length) out+='<details class="lens dir"><summary>DIRECTOR LENS</summary><div class="body"><ul class="pts">'+dir.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></details>';
  return out;
}
function go(k){
  i=Math.max(0,Math.min(S.length-1,k));
  const s=S[i];stage.innerHTML='';
  const el=document.createElement('div');el.className='slide';
  try{
    if(s.t==='q'){
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div>'
        +'<div class="qcard"><div class="qlabel">Think first &middot; predict before you peek</div>'
        +'<div class="qtext">'+s.q+'</div>'
        +'<div class="qsub">Form your answer in your head. Then press Next to compare.</div></div>';
    } else if(s.t==='r'){
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'
        +'<p>Answer from memory first. Tap a question to reveal the answer.</p>'
        +s.qs.map(x=>'<details class="recall-item"><summary>'+x.q+'</summary><div class="ans">'+x.a+'</div></details>').join('')
        +'<div class="recall-hint">Struggled on any? Jump back with the tabs above, then return.</div>';
    } else {
      el.innerHTML='<div class="eyebrow '+s.c+'">'+s.eyebrow+'</div><h2>'+s.h+'</h2>'+s.body+(((s.cto&&s.cto.length)||(s.dir&&s.dir.length))?lens(s.cto,s.dir):'');
    }
  }catch(err){
    el.innerHTML='<div class="eyebrow rose">Render error</div><h2>Slide '+(i+1)+' failed to render</h2><p>'+String(err&&err.message||err)+'</p>';
  }
  stage.appendChild(el);
  counter.textContent=(i+1)+' / '+S.length;
  document.querySelectorAll('.dot').forEach((d,k2)=>d.classList.toggle('on',k2===i));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===s.sec));
  prevBtn.disabled=(i===0);
  nextBtn.textContent=(i===S.length-1)?'Done \u2713':'Next \u2192';
  nextBtn.disabled=(i===S.length-1);
  document.querySelector('main').scrollTop=0;window.scrollTo(0,0);
}
prevBtn.onclick=()=>go(i-1);nextBtn.onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.target.closest('details'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
go(0);
</script>
